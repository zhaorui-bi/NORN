name: tests-and-build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.17'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts

  test:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
        profile: [base, cpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.17'
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.python }}-${{ matrix.profile }}
      - if: matrix.profile == 'base'
        run: uv sync --locked
      - if: matrix.profile == 'cpu'
        run: uv sync --locked --extra cpu --extra export
      - run: uv run --no-sync norn --version
      - if: matrix.profile == 'base'
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - if: matrix.profile == 'cpu'
        run: uv run --no-sync python -c "import torch, torch_harmonics; assert torch.version.cuda is None"
      - run: uv run --no-sync pytest -q --junitxml=pytest-results.xml
      - name: Annotate test failures
        if: failure()
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path('pytest-results.xml')
          if report.exists():
              for case in ElementTree.parse(report).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = (failure.text or failure.get('message', ''))[:30000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('name')}::{message}")
          PY

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.17'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
      - run: uv build --no-sources
      - run: uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
      - name: Verify installed wheel outside the source tree
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/norn" --version
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import norn_earth; assert 'site-packages' in norn_earth.__file__"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: norn-earth-packages
          path: dist/*
          if-no-files-found: error
