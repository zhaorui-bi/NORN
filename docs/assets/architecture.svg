<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">NORN 0.2 reconstruction workflow</title>
  <desc id="desc">Spatial inputs and age-conditioned SFNO generate shared-network thickness anchors. Paleo observations, modern thickness and supported physical constraints enter a single inversion objective. Checkpoints support standalone inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#58718d"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b65}.title{font-size:30px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#536171}.arrow{fill:none;stroke:#58718d;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="750" fill="white"/>
  <text x="40" y="43" class="title">NORN</text><text x="160" y="42" class="heading">Chronology-aware spherical crustal-thickness inversion</text>
  <rect x="40" y="80" width="320" height="185" rx="12" fill="#eef5ff" stroke="#9cb8d8"/>
  <text x="60" y="113" class="heading">A  Spatial inputs</text>
  <text x="60" y="146" class="body">Geometry + modern thickness</text>
  <text x="60" y="175" class="body">Declared tectonic covariates</text>
  <text x="60" y="207" class="small">Native data → Gauss grid</text>
  <text x="60" y="236" class="small">Explicit grid order and support flags</text>
  <rect x="440" y="80" width="320" height="185" rx="12" fill="#f2edfb" stroke="#b1a0d4"/>
  <text x="460" y="113" class="heading">B  Time-conditioned SFNO</text>
  <text x="460" y="146" class="body">Conv encoder → 6 SFNO blocks</text>
  <text x="460" y="175" class="body">SHT filtering + local convolution</text>
  <text x="460" y="207" class="small">Age → low-frequency MLP → FiLM</text>
  <text x="460" y="236" class="small">Positive single-channel output</text>
  <rect x="840" y="80" width="320" height="185" rx="12" fill="#eaf6f3" stroke="#91bfb3"/>
  <text x="860" y="113" class="heading">C  Thickness history</text>
  <text x="860" y="149" class="body">Hθ(x, a), 0–60 Ma</text>
  <text x="860" y="179" class="body">61 shared-network anchors</text>
  <text x="860" y="210" class="small">True-age interpolation</text>
  <text x="860" y="239" class="small">Periodic, differentiable sampling</text>
  <path d="M360 172 H433" class="arrow"/><path d="M760 172 H833" class="arrow"/>
  <rect x="40" y="325" width="360" height="225" rx="12" fill="#eef5ff" stroke="#9cb8d8"/>
  <text x="60" y="360" class="heading">D  Data consistency</text>
  <text x="60" y="400" class="body">Ancient records: age-mixture NLL</text>
  <text x="60" y="430" class="small">Reconstructed positions xᵢ(a)</text>
  <text x="60" y="460" class="small">One record, one likelihood</text>
  <text x="60" y="502" class="body">Modern endpoint: block-mean NLL</text>
  <rect x="440" y="325" width="720" height="225" rx="12" fill="#fff7e8" stroke="#d7b678"/>
  <text x="460" y="360" class="heading">E  Supported physical constraints</text>
  <text x="460" y="393" class="body">∂H/∂τ + divₛ(Hv) = q       τ = 60 − a</text>
  <rect x="460" y="414" width="210" height="67" rx="7" fill="white" stroke="#e0c99e"/>
  <text x="474" y="440" class="body">Material trajectories</text><text x="474" y="465" class="small">Sources + area deformation</text>
  <rect x="689" y="414" width="210" height="67" rx="7" fill="white" stroke="#e0c99e"/>
  <text x="703" y="440" class="body">Weak volume budgets</text><text x="703" y="465" class="small">Moving boundaries + fluxes</text>
  <rect x="918" y="414" width="222" height="67" rx="7" fill="white" stroke="#e0c99e"/>
  <text x="932" y="440" class="body">Process priors</text><text x="932" y="465" class="small">Birth + bounded net sources</text>
  <text x="460" y="515" class="small">Explicit masks • unknown fluxes disabled • shared evidence counted once</text>
  <path d="M1000 265 V295 H220 V318" class="arrow"/>
  <path d="M1000 295 V318" class="arrow"/>
  <rect x="40" y="605" width="1120" height="105" rx="12" fill="#eef1f6" stroke="#9cacc0"/>
  <text x="60" y="638" class="heading">F  Joint inversion and standalone inference</text>
  <text x="60" y="667" class="body">Age + modern + trajectory + budget + process priors + regularization</text>
  <text x="60" y="694" class="small">Two-pass gradients → AdamW → portable checkpoint → native maps and paleo-point queries</text>
  <path d="M220 550 V598" class="arrow"/><path d="M800 550 V598" class="arrow"/>
  <text x="40" y="738" class="small">Physics activation depends on supplied evidence. Real-data rigid-interior constraints are explicit prior hypotheses.</text>
</svg>
