[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "norn-earth"
version = "0.5.0"
description = "Chronology-aware spherical inversion of crustal-thickness history"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["geoscience", "crustal-thickness", "inverse-problems", "spherical-neural-operator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy==2.0.2", "pandas==2.3.3", "openpyxl==3.1.5", "scipy==1.13.1"]

[project.urls]
Repository = "https://github.com/zhaorui-bi/NORN"
Issues = "https://github.com/zhaorui-bi/NORN/issues"

[project.scripts]
norn = "norn_earth.cli:main"

[project.optional-dependencies]
cpu = ["torch==2.5.1", "torch-harmonics==0.8.0"]
cuda = ["torch==2.5.1", "torch-harmonics==0.8.0"]
kinematics = ["pygplates==1.0.0"]
export = ["xarray==2024.7.0"]
viz = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.16.10"]

[tool.uv]
required-version = ">=0.9.17"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
