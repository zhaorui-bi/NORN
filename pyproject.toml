[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norn-earth"
version = "0.2.0"
description = "Chronology-aware spherical inversion of crustal-thickness history"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["geoscience", "crustal-thickness", "inverse-problems", "spherical-neural-operator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "openpyxl>=3.1,<4", "scipy>=1.10,<2"]

[project.urls]
Repository = "https://github.com/zhaorui-bi/NORN"
Issues = "https://github.com/zhaorui-bi/NORN/issues"

[project.scripts]
norn = "norn_earth.cli:main"

[project.optional-dependencies]
sfno = ["torch==2.5.1", "torch-harmonics==0.8.0"]
kinematics = ["pygplates>=1.0,<2"]
export = ["xarray>=2023.1"]
viz = ["matplotlib>=3.7"]
boost = ["catboost>=1.2"]
dev = ["pytest>=7,<9", "ruff>=0.9", "build>=1.2", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["scripts/legacy"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
